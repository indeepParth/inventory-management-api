version: "3.9"

services:
  postgres:
    container_name: inventory-postgres
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  inventory-web:
    container_name: inventory-web
    build:
      context: ./inventory-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      inventory-api:
        condition: service_healthy
    restart: unless-stopped

  inventory-api:
    container_name: inventory-api
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: ${Database__ApplyMigrationsOnStartup:-false}
      Jwt__Issuer: ${Jwt__Issuer:?Set Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience:?Set Jwt__Audience}
      Jwt__Key: ${Jwt__Key:?Set Jwt__Key}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:?Set Cors__AllowedOrigins__0}
      ReverseProxy__KnownNetworks__0: ${ReverseProxy__KnownNetworks__0:?Set ReverseProxy__KnownNetworks__0}
      Authentication__AllowPublicRegistration: "false"
      Swagger__Enabled: "false"
      Bootstrap__Admin__Enabled: ${Bootstrap__Admin__Enabled:-false}
      Bootstrap__Admin__UserName: ${Bootstrap__Admin__UserName:-}
      Bootstrap__Admin__Email: ${Bootstrap__Admin__Email:-}
      Bootstrap__Admin__Password: ${Bootstrap__Admin__Password:-}
    volumes:
      - inventory_logs:/app/Logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  inventory_postgres_data:
  inventory_logs:
