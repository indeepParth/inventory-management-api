version: "3.9"

services:
  postgres:
    container_name: inventory-postgres
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventorydatabase_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "5433:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  inventory-web:
    container_name: inventory-web
    build:
      context: ./inventory-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      inventory-api:
        condition: service_healthy
    restart: unless-stopped

  inventory-api:

    container_name: inventory-api

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-inventorydatabase_dev};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-admin123}
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Key: ${Jwt__Key:?Set Jwt__Key before starting the container}
      Cors__AllowedOrigins__0: http://localhost:8081
      Bootstrap__Admin__Enabled: ${Bootstrap__Admin__Enabled:-true}
      Bootstrap__Admin__AllowOutsideProduction: "true"
      Bootstrap__Admin__UserName: ${Bootstrap__Admin__UserName:-admin}
      Bootstrap__Admin__Email: ${Bootstrap__Admin__Email:-admin@example.com}
      Bootstrap__Admin__Password: ${Bootstrap__Admin__Password:-AdminPassword123}

    volumes:
      - inventory_local_logs:/app/Logs

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  inventory_postgres_data:
  inventory_local_logs:
